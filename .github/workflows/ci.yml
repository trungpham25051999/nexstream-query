name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.config.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: Debug, type: Debug, cxx_flags: "", ld_flags: "" }
          - { name: Release, type: Release, cxx_flags: "", ld_flags: "" }
          - { name: ASan+UBSan, type: Debug, cxx_flags: "-fsanitize=address,undefined -fno-omit-frame-pointer", ld_flags: "-fsanitize=address,undefined" }
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libcurl4-openssl-dev

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config.type }} -DBUILD_TESTING=ON
          -DCMAKE_CXX_FLAGS="${{ matrix.config.cxx_flags }}"
          -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.config.ld_flags }}"

      - name: Build
        run: cmake --build build

      # HTTP/ClickHouse integration tests need the nexstream-deploy stack.
      - name: Test (unit)
        run: ctest --test-dir build --output-on-failure
